publications:
  - id: dlonet
    title: "DLONet: Local-to-Global Consistent Occlusion Ordering for Multi-Cable Harness Perception"
    authors: ["Haoran Liu*", "et al."]
    me: Haoran Liu
    author_note: "*Equal contribution. Full author list will appear with the arXiv version."
    venue: IEEE Robotics and Automation Letters (RA-L)
    status: under_review
    status_text: "Under review, IEEE RA-L"
    category: manuscripts
    date: 2026-10-01
    links: {}
    abstract_short: >-
      From a single RGB-D image, DLONet densely traces multiple deformable linear
      objects (cables) and recovers a globally consistent over/under occlusion
      ordering for wire-harness assembly. A three-stage pipeline (TraceNet →
      RelationNet → GraphNet) propagates predictions together with their
      confidences, so local pairwise relations are reconciled into a cycle-free
      global layer order.
    highlights:
      - "Tracing success rate 0.89 vs. 0.67 for HANDLOOM; 94.3% crossing-relation accuracy; 88.6% topologically-correct rate in multi-cable scenes."
      - "Frontier VLMs (GPT-5.2, Claude Opus 4.6, Qwen2.5-VL-72B) are near chance on multi-cable ordering zero-shot."
      - "Deployed on a Kinova Gen3 with a RealSense D435i: 90% success on real cable extraction."
    my_role:
      - {text: "Designed and trained the three network stages: TraceNet (dense centerline/event/keypoint heatmaps + embedding field, curvature-regularized decoder), RelationNet (event validity, over/under, signed depth with heteroscedastic uncertainty), and GraphNet (message passing to suppress ordering cycles; continuous Layer Field).", own: lead}
      - {text: "Ran all baseline and VLM evaluations (HANDLOOM reproduction; zero-shot GPT-5.2 / Claude Opus 4.6 / Qwen2.5-VL-72B) and the ablation study.", own: lead}
      - {text: "Built the Kinova Gen3 + RealSense D435i cable-extraction demo (90% success).", own: lead}
      - {text: "Co-developed the ~35k-scene synthetic data pipeline (procedural cables, mass–spring relaxation, Blender rendering, auto-annotation) and the 100-scene real MDLO benchmark.", own: co}
      - {text: "Led manuscript writing and reviewer rebuttals; owned multi-GPU training infrastructure on Georgia Tech PACE.", own: lead}
    selected: true
    visibility: public

  - id: vqactflow
    title: "VQActFlow: Vector-Quantized Action Mode Steering for Multi-Task Robot Manipulation"
    authors: ["Zhigen Zhao", "Mark Leggiero", "Yipu Chen", "Haoran Liu", "Yifan Wu", "Huishu Xue", "Sirui Zhan", "Ye Zhao"]
    me: Haoran Liu
    author_note: ""
    venue: IEEE Robotics and Automation Letters (RA-L)
    status: under_review
    status_text: "Under review (revision), IEEE RA-L"
    category: manuscripts
    date: 2026-06-19
    links:
      arxiv: https://arxiv.org/abs/2606.21600
      project: https://mleggiero.github.io/vqactflow-website
    abstract_short: >-
      VQActFlow tokenizes robot actions with a VQ-VAE and trains a diffusion
      transformer with Variational Flow Matching to predict categorical
      distributions over the codebook. Because action modes are discrete, the
      policy can be steered at inference time with classifier-free guidance on
      language and a lightweight codebook critic.
    highlights:
      - "LIBERO-Goal 73.0 → 81.0%; LIBERO-90 80.5% vs. 77.2% (CFM), 72.4% (MT-ACT)."
      - "Unitree G1 humanoid, 4 pick-and-place tasks: 23.8 → 57.5% success, wrong-task rate 41.3 → 2.5%."
      - "ALOHA-style bimanual, 4 contact-rich tasks: 45.0 → 77.5%; the CFM baseline failed all four."
    my_role:
      - {text: "Led the LIBERO-Goal / LIBERO-90 experiments and the codebook ablation.", own: lead}
      - {text: "Collected the Unitree G1 teleoperation dataset (TWIST2 VR, 140 demos/task) and led G1 deployment and evaluation on four pick-and-place tasks.", own: lead}
      - {text: "Ran the ALOHA-style bimanual experiments (four contact-rich tasks, 75 demos/task).", own: lead}
      - {text: "Engineered inference latency to 155–350 ms per action chunk on an RTX 5090.", own: lead}
      - {text: "Contributed to the VQ-VAE tokenizer, VFM objective, guidance (CFG + codebook critic), and matched-protocol baseline reproduction (CFM, MT-ACT, VQ-BeT, Discrete Policy + CFG).", own: co}
      - {text: "Co-wrote the manuscript and the RA-L revision.", own: lead}
    selected: true
    visibility: public

  - id: robochrono
    title: "RoboChrono: A Real Robot Benchmark for Streaming Task Understanding"
    authors: ["Yuzhou Wu", "Longteng Fan", "Zimeng Li", "Yu Wanchan", "Ting Zhang", "Yiyang Ma", "Shihao Li", "Wei Ying", "Jianbin Qin", "Jiajian Jing", "Fangwen Chen", "Yifan Wu", "Zichen Zhang", "Ruiqi Yang", "Weibin Kong", "Yihang Xu", "Haoran Liu", "Zonghang He", "Xuyang Liu", "YiFan Xiong", "Siteng Huang", "Tao Xu", "Zhuo Xu", "Long Chen", "Ruoxiang Li"]
    me: Haoran Liu
    author_note: ""
    venue: arXiv preprint
    status: preprint
    status_text: "arXiv preprint, September 2026"
    category: preprints
    date: 2026-09-29
    links:
      arxiv: https://arxiv.org/abs/2609.36605
      project: https://continuity3.github.io/robochrono
      code: https://github.com/mfan-res/ROBOCHRONO
    abstract_short: >-
      RoboChrono is a real-robot benchmark for streaming task understanding:
      39 scenarios, 34,713 instances and ~25 hours of synchronized head- and
      wrist-camera video from two dual-arm platforms, with seven causal QA tasks
      (current/next action, frame and view matching, frame ordering, action time
      localization) evaluated on 18 VLMs.
    highlights:
      - "Best model (GPT-6-Astra) reaches 80.5% average but only 68.3% on Frame Ordering; best open model 62.8%."
      - "Input ablations show next-action prediction leans on task priors rather than vision."
    my_role:
      - {text: "Led VR-teleoperation data collection on GIM's dual-arm whole-workspace platform.", own: lead}
      - {text: "Designed the human-annotation and QA-template protocol that converts action/state intervals into the seven benchmark tasks.", own: lead}
      - {text: "Built the VLM evaluation harness and ran the zero-shot evaluation sweep.", own: lead}
      - {text: "Led results analysis and co-wrote the paper.", own: lead}
      - {text: "Contributed to scenario design, camera synchronization, input ablations, and the Hugging Face dataset release (gimai/RC-GIM).", own: co}
    selected: true
    visibility: public

