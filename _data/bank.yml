  - id: gim
    org: General Intelligence Machine (GIM)
    role: Research Intern
    start: 2026-06
    end: present
    location: Remote
    pi: ""
    kind: internship
    tags: [data, real-robot, VLA, systems]
    bullets:
      - {text: "Core contributor to RoboChrono, a real-robot benchmark for streaming task understanding (39 scenarios, 34.7k instances, 18 VLMs evaluated): led VR-teleop data collection, the annotation/QA protocol, and the VLM evaluation harness.", tags: [data, real-robot], own: lead, visibility: public, status: ok}
      - {text: "Operate GIM's dual-arm whole-workspace platform with VR teleoperation for data collection and policy evaluation.", tags: [real-robot, systems], own: lead, visibility: public, status: ok}
      - {text: "Additional GIM projects (robot learning / VLA) — to be added after internal review.", tags: [VLA], own: lead, visibility: public, status: TBD}
    project_page:
      slug: robochrono
      order: 1
      title: "RoboChrono: Streaming Task Understanding on Real Robots"
      teaser: /images/placeholders/robochrono.svg
      excerpt: "A real-robot benchmark probing whether VLMs understand what a robot is doing right now, and what it should do next."
      body_md: |
        **Context.** Research Intern at General Intelligence Machine (GIM), Jun 2026 – present.

        **What it is.** RoboChrono asks vision-language models seven questions about a live robot
        stream, under a causal protocol (only frames up to time *t* are visible): what is the robot
        doing now, what comes next, which frame or view matches, in what order did things happen,
        and when did an action start and end. The data comes from two real dual-arm platforms,
        collected via VR teleoperation with synchronized head and wrist cameras, and is annotated
        by humans into action and state intervals.

        **My part.** I led the VR-teleop data collection on GIM's dual-arm whole-workspace platform,
        designed the annotation and QA-template protocol, built the VLM evaluation harness used for
        the 18-model sweep, and led the results analysis. I also contributed to scenario design,
        camera synchronization, the input ablations, and the Hugging Face release.

        **Why it matters.** The best frontier model scores 80.5% on average but drops to 68.3% on
        frame ordering, and removing vision barely hurts next-action prediction. VLMs still lean on
        task priors rather than on what they see, which is exactly the failure mode a robot cannot
        afford.

        Paper: [arXiv 2609.36605](https://arxiv.org/abs/2609.36605) ·
        [project page](https://continuity3.github.io/robochrono) ·
        [code](https://github.com/mfan-res/ROBOCHRONO)
    visibility: public

