    orcid: https://orcid.org/0009-0007-7918-0145
    scholar: https://scholar.google.com/citations?user=BMbTAmkAAAAJ
  research_statement: >-
    Closing the loop between perception, language, and action via learned
    representations and agentic orchestration.
  bio_long: |
    I am an MSc Robotics student at Georgia Tech (College of Computing), working on
    robot learning and embodied AI. I am a Graduate Research Assistant in the LIDAR Lab
    with Prof. Ye Zhao and in Prof. Sehoon Ha's lab, and a Research Intern at
    General Intelligence Machine (GIM).

    My research centers on reliably wiring vision-language-model semantics into the
    robot-learning loop and understanding where it breaks: structured scene
    understanding with calibrated uncertainty (DLONet), benchmarking the temporal
    understanding of VLMs on real robot streams (RoboChrono), and steerable
    discrete action generation for multi-task manipulation (VQActFlow). All of this
    work is validated on real robots, including Kinova Gen3, Unitree G1, ALOHA-style
    bimanual arms, and GIM's dual-arm platform.

    Before Georgia Tech I studied Mathematics at HKUST (BSc, First Class Honours), with remote research collaborations at UC Berkeley and ETH Zurich.
  interests:
    - Robot manipulation and vision-language-action models
    - Reward and value models for VLA post-training
    - Real-to-sim-to-real and simulation from video
    - Agentic orchestration of robot skills

